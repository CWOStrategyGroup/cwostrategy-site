#=============================================================================
# CWO Strategy Group — netlify.toml
# Security headers, HTTPS, caching, redirects, custom 404.
# Apache and Nginx equivalents are in the comments at the bottom.
#=============================================================================

[build]
  publish = "."
  command = ""

#-----------------------------------------------------------------------------
# 1. CANONICAL HOST + LEGACY URL REDIRECTS
#-----------------------------------------------------------------------------
[[redirects]]
  from = "https://www.cwostrategy.com/*"
  to = "https://cwostrategy.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/contact"
  to = "/start-a-project.html"
  status = 301

[[redirects]]
  from = "/contact.html"
  to = "/start-a-project.html"
  status = 301

[[redirects]]
  from = "/services"
  to = "/#services"
  status = 301

[[redirects]]
  from = "/privacy"
  to = "/privacy-policy.html"
  status = 301

[[redirects]]
  from = "/terms-of-service"
  to = "/terms.html"
  status = 301

[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 301

[[redirects]]
  from = "/portal"
  to = "/portal.html"
  status = 301

# Custom 404 — must be LAST.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

#-----------------------------------------------------------------------------
# 2. SECURITY HEADERS
#    CSP is strict: no external script, style, or font origins are needed
#    because the site ships zero third-party assets.
#-----------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Permissions-Policy = "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), screen-wake-lock=(), usb=(), xr-spatial-tracking=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; upgrade-insecure-requests"

#-----------------------------------------------------------------------------
# 3. AUTHENTICATED ROUTES — never cache, never index
#-----------------------------------------------------------------------------
[[headers]]
  for = "/portal.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, private"
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/login.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, private"
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/reset-password.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, private"
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

#-----------------------------------------------------------------------------
# 4. CACHING
#    HTML always revalidates so edits go live immediately.
#    Assets cache for a week — bump a ?v= query when you change them.
#-----------------------------------------------------------------------------
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/scroll.js"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/portal.js"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

#=============================================================================
# APACHE EQUIVALENT — save as .htaccess at the web root
#=============================================================================
