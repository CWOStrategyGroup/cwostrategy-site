# RewriteEngine On
# RewriteCond %{HTTPS} off [OR]
# RewriteCond %{HTTP_HOST} ^www\. [NC]
# RewriteCond %{HTTP_HOST} ^(?:www\.)?(.+)$ [NC]
# RewriteRule ^ https://%1%{REQUEST_URI} [L,NE,R=301]
#
# ErrorDocument 404 /404.html
#
# <IfModule mod_headers.c>
#   Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
#   Header always set X-Content-Type-Options "nosniff"
#   Header always set X-Frame-Options "DENY"
#   Header always set Referrer-Policy "strict-origin-when-cross-origin"
#   Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
#   Header always set Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; upgrade-insecure-requests"
#   Header always unset X-Powered-By
#   <FilesMatch "(portal|login|reset-password)\.html$">
#     Header always set Cache-Control "no-store, no-cache, must-revalidate, private"
#     Header always set X-Robots-Tag "noindex, nofollow, noarchive"
#   </FilesMatch>
# </IfModule>
#
# <FilesMatch "^\.|\.(env|git|yml|ini|log|sql|bak)$">
#   Require all denied
# </FilesMatch>
#
# <IfModule mod_deflate.c>
#   AddOutputFilterByType DEFLATE text/html text/css text/plain text/xml \
#     application/javascript application/json image/svg+xml
# </IfModule>
#
# <IfModule mod_expires.c>
#   ExpiresActive On
#   ExpiresByType text/css "access plus 7 days"
#   ExpiresByType application/javascript "access plus 7 days"
#   ExpiresByType image/svg+xml "access plus 30 days"
#   ExpiresByType text/html "access plus 0 seconds"
# </IfModule>

